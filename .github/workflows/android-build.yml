name: Storm Launcher Android ARM64 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36.1 Platform, NDK, and CMake
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail

          NDK_PKG=$(sdkmanager --list | grep -oE 'ndk;27\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
          if [ -z "$NDK_PKG" ]; then
            NDK_PKG=$(sdkmanager --list | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)
          fi

          CMAKE_PKG=$(sdkmanager --list | grep -oE 'cmake;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)

          echo "Installing SDK packages: platforms;android-36 platforms;android-36.1 build-tools;36.0.0 $NDK_PKG $CMAKE_PKG"
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "$NDK_PKG" "$CMAKE_PKG"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          NDK_DIR=$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build Box64 ARM64 Native Translator (Upstream Source)
        run: |
          chmod +x runtime/box64/build_box64_arm64.sh native/build-scripts/build_all_arm64.sh
          ./runtime/box64/build_box64_arm64.sh build/runtime-staging/box64 || echo "Box64 cross-build step completed with warnings"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK (with C++20 JNI Native Bridge)
        run: gradle :app:assembleDebug -PenableNativeBridge=true --no-daemon --stacktrace

      - name: Verify Debug APK Output
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storm-launcher-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

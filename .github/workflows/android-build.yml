
name: Storm Launcher Android ARM64 Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storm-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Build Storm Launcher Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_CMAKE_VERSION: "3.22.1"

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Setup Android SDK
      # Penting: jangan meminta paket SDK lama bernama "tools".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 4. Install Android SDK packages
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          echo "Verifying Android SDK installation..."

          sdkmanager --list_installed

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          test -d "${SDK_ROOT}/platforms/android-36"
          test -d "${SDK_ROOT}/platforms/android-36.1"
          test -d "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}"

          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # 5. Prepare Debug Keystore
      - name: Prepare Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s debug.keystore
          ls -lh debug.keystore

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      # 7. Verify project structure
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt

          echo "Project structure verified."

      # 8. Gradle validation
      - name: Validate Gradle configuration
        run: |
          gradle --version
          gradle projects \
            --no-daemon \
            --stacktrace

      # 9. Run unit tests
      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      # 10. Build native JNI bridge and Android APK
      - name: Build Android Debug APK
        run: |
          gradle :app:assembleDebug \
            -PenableNativeBridge=true \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      # 11. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "Checking APK package..."
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 10

      # 12. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Storm-Launcher-Android-ARM64-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Upload diagnostic reports if build fails
      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Storm-Launcher-Build-Diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7

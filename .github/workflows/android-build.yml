name: Storm Launcher Android ARM64 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36/36.1, NDK 27.2.12479018, and CMake 3.22.1
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail

          PKGS=("platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1")
          if sdkmanager --list 2>/dev/null | grep -q 'platforms;android-36\.1'; then
            PKGS+=("platforms;android-36.1")
          fi
          sdkmanager "${PKGS[@]}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Assemble Debug APK (with C++20 JNI Native Bridge)
        run: gradle :app:assembleDebug -PenableNativeBridge=true --no-daemon --no-configuration-cache --stacktrace

      - name: Verify Debug APK Output
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Build Box64 ARM64 Native Translator (Optional Upstream Staging)
        run: |
          chmod +x runtime/box64/build_box64_arm64.sh native/build-scripts/build_all_arm64.sh
          ./runtime/box64/build_box64_arm64.sh /tmp/runtime-staging/box64 || echo "Box64 cross-build step completed with warnings"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storm-launcher-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
